<!DOCTYPE html>
<html>
<head>
  <script src="aframe.min.js"></script>
</head>

<script>


	AFRAME.registerComponent('hover-scale', {
		init: function () { 
			const el = this.el;
			const text = el.querySelector('a-text');

			el.addEventListener('mouseenter', () => {
				el.removeAttribute('animation__scale'); 
				el.setAttribute('animation__scale', {
					property: 'scale',
					to: '2 2 2',
					dur: 300,
					easing: 'easeOutCubic'
				  });
				text.setAttribute('visible',true);
			}
			);

			el.addEventListener('mouseleave', () => {
			  el.removeAttribute('animation__scale'); 
			  el.setAttribute('animation__scale', {
				property: 'scale',
				to: '1 1 1',
				dur: 200,
				easing: 'easeOutCubic'
			  });
			  text.setAttribute('visible',false);
			}
			);
		  }
		});
		


		
		function getRandomColor() {
		  const letters = '0123456789ABCDEF';
		  var color = '#';
		  for (var i = 0; i < 7; i++ ) {
			color += letters[Math.floor(Math.random() * 16)];
			
		  }
		  console.log("color: " + color);
		  return color;
		}
		
		



					AFRAME.registerComponent('box-spawner', {
		  init: function () {
			this.el.sceneEl.addEventListener('loaded', () => {
			  this.spawnNextBox();
			});
		  },

		  spawnNextBox: function () {
			const sceneEl = this.el.sceneEl;

			const box = document.createElement('a-box');
			box.setAttribute('color', getRandomColor());
			box.setAttribute('depth', 1);
			box.setAttribute('height', 0.8);
			box.setAttribute('width', 0.8);
			box.setAttribute('click-gone','');

			
			const randomInRange = (min, max) => Math.random() * (max - min) + min;
			const x = randomInRange(-4, 4);
			const y = randomInRange(1, 3);
			const z = randomInRange(-5, -8);

			box.setAttribute('position', { x, y, z });
			sceneEl.appendChild(box);

			
			setTimeout(() => {
			  if (box.parentNode) {
				box.parentNode.removeChild(box);
			  }
			  this.spawnNextBox();
			}, 500);
		  }
		});
		
		
				AFRAME.registerComponent('click-gone', {

		  init: function () {
			this.el.addEventListener('mousedown', () => {
			console.log("click");
			this.el.setAttribute('visible',false);
		  })
		}});
		




</script>

<body>
  <a-scene>

	<a-cylinder id="ground" src="https://cdn.aframe.io/a-painter/images/floor.jpg" radius="32" height="0.1"></a-cylinder>

    <a-entity id="player" camera look-controls="pointerLockEnabled: true" wasd-controls position="0 1.8 2">
      <a-entity cursor="fuse: true; fuseTimeOut: 1500"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                material="color: red; shader: flat">
      </a-entity>
    </a-entity>

<a-sky color = "lightblue"  theta-length="90" radius="30"> </a-sky>
	
	
	<!--
	
    <a-entity random-color position="1 2 -3" geometry="primitive: box" visible="false" hover-scale>
      <a-text value="Blue Box" position="-0.5 1 0.5" visible="false" color="lightblue"></a-text>
    </a-entity>

    <a-box random-color color="red" position="-1 2 -3" visible="false" hover-scale>
      <a-text value="Red Box" position="-0.5 1 0.5" visible="false" color="lightblue"></a-text>
    </a-box>
	
	-->
	
	<a-entity box-spawner  ></a-entity>
	
  </a-scene>
</body>
</html>
