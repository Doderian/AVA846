<!DOCTYPE html>
<html>
<head>
  <script src="aframe.min.js"></script>
</head>

<script>
	AFRAME.registerComponent('hover-scale', {
		init: function () {
			const el = this.el;
			const text = el.querySelector('a-text');

			el.addEventListener('mouseenter', () => {
			el.removeAttribute('animation__scale'); 
			el.setAttribute('animation__scale', {
				property: 'scale',
				to: '1.6 1.6 1.6',
				dur: 200,
				easing: 'easeOutCubic'
			  });
			text.setAttribute('visible',true);
			});

			el.addEventListener('mouseleave', () => {
			  el.removeAttribute('animation__scale'); 
			  el.setAttribute('animation__scale', {
				property: 'scale',
				to: '1 1 1',
				dur: 200,
				easing: 'easeOutCubic'
			  });
			  text.setAttribute('visible',false);
			});
		  }
		});
		
</script>

<body>
  <a-scene>

    <a-entity id="player" camera look-controls wasd-controls position="0 1.8 2">
      <a-entity cursor="fuse: false"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                material="color: red; shader: flat">
      </a-entity>
    </a-entity>

    <a-sky color="lightblue"></a-sky>


    <a-box color="blue" position="1 2 -3" hover-scale>
      <a-text value="Blue Box" position="-0.5 1 0.5" visible="false"></a-text>
    </a-box>

    <a-box color="red" position="-1 2 -3" hover-scale>
      <a-text value="Red Box" position="-0.5 1 0.5" visible="false"></a-text>
    </a-box>
  </a-scene>
</body>
</html>
