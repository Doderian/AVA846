<!DOCTYPE html>
<html>
<head>


   <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
   <script src="dist/aframe-particle-system-component.min.js"></script>
   <script src="https://unpkg.com/aframe-watcher/dist/aframe-watcher.min.js"></script>

<link rel="icon" href="data:,">


</head>

<script>

		let count = 0;
		
		const counterText = document.querySelector('#counterText');
		
		
		
		
		function getRandomColor() {
		  const letters = '0123456789ABCDEF';
		  var color = '#';
		  for (var i = 0; i < 6; i++ ) {
			color = color + letters[Math.floor(Math.random() * 16)];
			
		  }
		  
		  return color;
		}
		
		
		
			AFRAME.registerComponent('hover-scale', {
		init: function () {
			const el = this.el;
			const text = el.querySelector('a-text');

			el.addEventListener('mouseenter', () => {
				el.removeAttribute('animation__scale'); 
				el.setAttribute('animation__scale', {
					property: 'scale',
					to: '1.5 1.5 1.5',
					dur: 300,
					easing: 'easeOutCubic'
				  });
				
			}
			);

			el.addEventListener('mouseleave', () => {
			  el.removeAttribute('animation__scale'); 
			  el.setAttribute('animation__scale', {
				property: 'scale',
				to: '1 1 1',
				dur: 200,
				easing: 'easeOutCubic'
			  });
			  
			}
			);
		  }
		});
		
		
		
						AFRAME.registerComponent('start-button', {
				  init: function () {
					this.enabled = true;

					this.clickHandler = () => {
					  if (!this.enabled) return;

					  const counterText = document.querySelector('#counterText');
					  const spawnerEl = document.querySelector('#spawner');
					  const stopButton = document.querySelector('[stop-button]');

					  if (!spawnerEl || !counterText) return;

					  count = 0;
					  const limit = spawnerEl.getAttribute('box-spawner').limit;
					  counterText.setAttribute('text', 'value', `0/` + limit);
					  counterText.setAttribute('visible', true);

					  spawnerEl.setAttribute('visible', true);
					  spawnerEl.components['box-spawner'].startSpawning();

					  this.enabled = false;
					  this.el.setAttribute('visible', false);

					  if (stopButton) {
						stopButton.setAttribute('visible', true);
						stopButton.components['stop-button'].enable();
					  }
					};

					this.el.addEventListener('click', this.clickHandler);
				  },

				  enable: function () {
					this.enabled = true;
				  }
				});






				AFRAME.registerComponent('stop-button', {
				  init: function () {
					this.enabled = false;
					this.spawnerEl = document.querySelector('#spawner');
					this.startButton = document.querySelector('[start-button]');
					
					this.spawnerEl.addEventListener('spawn-finished', () => 
					{
					  this.enabled = false;
					  this.el.setAttribute('visible', false);
					});

					this.clickHandler = () => {
					  if (!this.enabled) return;

					  // Stop spawning
					  if (this.spawnerEl) {
						this.spawnerEl.components['box-spawner'].running = false;
					  }

					  // Show start button again
					  if (this.startButton) {
						this.startButton.setAttribute('visible', true);
						this.startButton.components['start-button'].enable();
					  }

					  // Disable and hide this stop button
					  this.enabled = false;
					  this.el.setAttribute('visible', false);
					};

					this.el.addEventListener('click', this.clickHandler);
				  },

				  enable: function () {
					this.enabled = true;
					this.el.setAttribute('visible', true);
				  }
				});




			

					AFRAME.registerComponent('set-limit', {
				  schema: { value: { type: 'int' } },

				  init: function () 
				  {
					this.el.addEventListener('click', () => 
						{
						
						 const soundEl = this.el.querySelector('a-sound');
						 
						  if (soundEl) 
						  {
								soundEl.setAttribute('poolSize', 5);
								soundEl.components.sound.playSound();
						  }
						
						const spawner = document.querySelector('#spawner');

						  if (spawner)
						  {
								spawner.setAttribute('box-spawner', 'limit', this.data.value);
								console.log(`Spawn limit set to` + this.data.value);
						  }
						}
					);
				  }
				});
				
				
				
						AFRAME.registerComponent('set-difficulty', {
					  schema: { interval: { type: 'int' } },

					  init: function () {
						this.el.addEventListener('click', () => {
						
						 const soundEl = this.el.querySelector('a-sound');
						 
						  if (soundEl) 
						  {
								soundEl.setAttribute('poolSize', 5);
								soundEl.components.sound.playSound();
						  }
						  
						  const spawner = document.querySelector('#spawner');
						  
						  if (spawner)
						  {
								spawner.setAttribute('box-spawner', 'spawnInterval', this.data.interval);
								console.log(`Difficulty set. Interval: ${this.data.interval}ms`);
						  }
						});
					  }
					});
		
		
		
		
		
					AFRAME.registerComponent('box-spawner', {
				  schema: {
					limit: { type: 'int', default: 10 },
					spawnInterval: { type: 'int', default: 660 }
				  },

				  init: function () {
					this.spawnedCount = 0;
					this.running = false;
				  },

				  startSpawning: function () {
					if (this.running) return;
				


					this.spawnedCount = 0;
					this.running = true;
					this.spawnNextBox();
				  },

				  spawnNextBox: function () {
					if (!this.running || this.spawnedCount >= this.data.limit) {
					  this.running = false;
					  
					  this.el.emit('spawn-finished');

					  // show the start button again
					  const startButton = document.querySelector('[start-button]');
					  if (startButton) {
						startButton.setAttribute('visible', true);
						startButton.components['start-button'].enable();
					  }

					  return;
					}

					const sceneEl = this.el.sceneEl;
					const box = document.createElement('a-box');
					box.setAttribute('class', 'clickable');
					box.setAttribute('color', getRandomColor());
					box.setAttribute('depth', 1);
					box.setAttribute('height', 0.8);
					box.setAttribute('width', 0.8);
					box.setAttribute('click-gone', '');
					
					
					
					const sound = document.createElement('a-sound');
					sound.setAttribute('src', '#clickSound');
					sound.setAttribute('on', 'click');
					sound.setAttribute('autoplay', 'false');
					box.appendChild(sound);
						
					
					
					const randomInRange = (min, max) => Math.random() * (max - min) + min;
					const x = randomInRange(-4, 4);
					const y = randomInRange(1, 3);
					const z = randomInRange(-5, -8);

					box.setAttribute('position', { x, y, z });
					sceneEl.appendChild(box);

					this.spawnedCount++;

					setTimeout(() => {
					  if (box.parentNode) {
						box.parentNode.removeChild(box);
					  }
					  this.spawnNextBox();
					}, this.data.spawnInterval);
				  }
				});


		
				function particles(position){
				let particle = document.createElement('a-entity');
						console.log('1');
					
					 particle.setAttribute('particle-system', {
						particleCount: 300,
						size: [0.5, 0],
						color: ['#ffffff', '#000000'],
						velocityValue: '0 2 0',
						accelerationValue: '0 -3 0',
						duration: 0.05,
						maxAge: 1.5,
						blending: 2,
						texture: './assets/cloudSml.png',
						opacity: [0.2, 0]
					  });
					  
					  console.log('2');
					  
					  particle.setAttribute('position', position );
					  document.getElementById('scene').appendChild(particle);
					  
						
						
						console.log('3');
						
					  setTimeout(() => {
						particle.parentNode && particle.parentNode.removeChild(particle);
					  }, 500);
		
				}
		
		
		  AFRAME.registerComponent('player-constraints', {
			schema: {
			  minX: { type: 'number', default: -5 },
			  maxX: { type: 'number', default: 5 },
			  minZ: { type: 'number', default: -5 },
			  maxZ: { type: 'number', default: 5 }
			},

			tick: function () {
			  const position = this.el.getAttribute('position');

			  
			  position.x = Math.max(this.data.minX, Math.min(this.data.maxX, position.x));
			  position.z = Math.max(this.data.minZ, Math.min(this.data.maxZ, position.z));

			  this.el.setAttribute('position', position);
			}
		  });
		  
		  
		
			AFRAME.registerComponent('click-gone', {

		  init: function () {
		  
			this.el.addEventListener('mousedown', () => {
			console.log("click");
			
			 const soundEl = this.el.querySelector('a-sound');
			 if (soundEl) soundEl.components.sound.playSound();
			 
			particles(this.el.getAttribute('position'));
			
			console.log('4');
			
			if (this.el.getAttribute('visible') == true)
			{
			counter();
			}
			
			//this.el.setAttribute('color', `#000000`);
			this.el.setAttribute('visible',false);
			
			})
		}});
		
		
		
				function counter() {
		  const counterText = document.querySelector('#counterText');
		  const spawnerEl = document.querySelector('#spawner');

		  if (!counterText || !spawnerEl) return;

		  count++;

		  const limit = spawnerEl.getAttribute('box-spawner').limit;
		  counterText.setAttribute('text', 'value', count + `/` + limit);
		  console.log(`Counter:` + count + `/` + limit);
		}


</script>

<body>
  <a-scene id="scene">
	
	
		<a-assets>
			<audio id = "clickSound" src = "assets/blip.wav"> </audio>
			
			<img id= "raindrop" src = "assets/raindrop.png">
			<img id= "cloud" src = "assets/cloud.png">
			<img id= "cloudSml" src = "assets/cloudSml.png">
			<img id= "shockwave" src = "assets/shockwave.png">
			<img id= "smokeparticle" src = "assets/smokeparticle.png">
			<img id= "star" src = "assets/star.png">
			<img id= "star2" src = "assets/star2.png">
			<img id= "hardwood" src = "assets/hardwoodFloor.jpg">
			
		</a-assets>
	
	
			  <a-entity position="0 2.25 -15" particle-system="preset: dust; particleCount: 1500; size: 0.5"></a-entity>


	
	<a-cylinder id="ground" position="0 0 -3" material="src: #hardwood; repeat: 7 7;" radius="7" height="0.1"></a-cylinder>

	<a-sky color="black"></a-sky>
	
	
    <a-entity id="player" camera look-controls="pointerLockEnabled: true" wasd-controls position="0 1.8 2" player-constraints="minX: -4; maxX: 4; minZ: -2; maxZ: 2">
      <a-entity cursor
				raycaster="objects: .clickable"
				position="0 0 -1"
				geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
				material="color: red; shader: flat">
      </a-entity>
	  
	  
	  	<a-entity id="counterText" 
			  text="value: 0; color: white; width: 10" 
			  position = "10 3 -4"
			  visible="false"
			  >
			  
		</a-entity>
		
    </a-entity>

	  <a-box id="startButton"
		class="clickable"
         color="#4CAF50"
         position="3 1.5 -3"
         depth="0.5"
         height="0.5"
         width="1.5"
         start-button
		 hover-scale
		 >
		 <a-text value="Start test" position="-0.5 0 0.3" visible="true"></a-text>
		 
		</a-box>
		
		 <a-box id="stopButton"
		class="clickable"
         color="#F44336"
         position="3 2.5 -3"
         depth="0.5"
         height="0.5"
         width="1.5"
		 visible="false"
         stop-button
		 hover-scale
		 >
		 <a-text value="Stop test" position="-0.5 0 0.3" visible="true"></a-text>
		 
		</a-box>
		
		<a-entity position="-3.3 0 0" rotation="0 38 0">
		
		
				<a-box hover-scale class="clickable" color="#8BC34A" position="-1 0.5 -3" width="1" height="0.4" depth="0.3" 
						set-limit="value: 10">
			   
					<a-text value="10" align="center" position="0 0 0.2" width="4"></a-text>
					<a-sound src = "#clickSound" sound> </a-sound>
				  
				</a-box>



				<a-box hover-scale class="clickable" color="#FFC107" position="0 0.5 -3" width="1" height="0.4" depth="0.3" 
					   set-limit="value: 25">
					   
					<a-text value="25" align="center" position="0 0 0.2" width="4"></a-text>
					<a-sound src = "#clickSound" sound> </a-sound>
				  
				</a-box>



				<a-box hover-scale class="clickable" color="#FF5722" position="1 0.5 -3" width="1" height="0.4" depth="0.3" 
					   set-limit="value: 50">
					   
					<a-text value="50" align="center" position="0 0 0.2" width="4"></a-text>
					<a-sound src = "#clickSound" sound> </a-sound>
				  
				</a-box>
				
				
				
				<a-text value="Click to set box limit" position = "-1 0.2 -2.5" rotation="-50 0 0"> </a-text>
				
				
				
				
			
			
				<a-box hover-scale class="clickable" color="#8BC34A" position="-1 1.5 -3" width="1" height="0.4" depth="0.3"
					   set-difficulty="interval: 1000">
					   
				<a-text value="Easy" align="center" position="0 0 0.2" width="4"></a-text>
				<a-sound src = "#clickSound" sound> </a-sound>
					
				</a-box>


				<a-box hover-scale class="clickable" color="#FFC107" position="0 1.5 -3" width="1" height="0.4" depth="0.3"
					   set-difficulty="interval: 660">
					   
				<a-text value="Medium" align="center" position="0 0 0.2" width="4"></a-text>
				<a-sound src = "#clickSound" sound> </a-sound>
				  
				</a-box>


				<a-box hover-scale class="clickable" color="#F44336" position="1 1.5 -3" width="1" height="0.4" depth="0.3"
					   set-difficulty="interval: 500">
					   
				 <a-text value="Hard" align="center" position="0 0 0.2" width="4"></a-text>
				 <a-sound src = "#clickSound" sound> </a-sound>
				  
				</a-box>
	
				<a-text value="Click to choose difficulty" position = "-1.2 1.1 -2.6" rotation="-40 0 0"> </a-text>
				
	</a-entity>
	
	
		
	<a-entity id="spawner"
	box-spawner 
	visible="false"  >

	</a-entity>
	
	<a-entity light="type: directional; intensity: 0.8" position="1 3 2"></a-entity> 

	<a-entity light="type: ambient; intensity: 0.3"></a-entity> 
	
  </a-scene>
</body>
</html>
